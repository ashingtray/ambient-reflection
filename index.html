<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ambient Reflection</title>
<style>
  :root{--ink:rgba(255,255,255,0.92);--dim:rgba(255,255,255,0.45);--line:rgba(255,255,255,0.14);--track:rgba(4,8,20,0.6);--blue:143,180,255;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000107;overflow:hidden;overscroll-behavior:none;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  #sky{position:fixed;inset:0;z-index:0;}
  #cap{position:fixed;inset:0;z-index:5;width:100%;height:100%;background:transparent;border:none;outline:none;resize:none;color:transparent;caret-color:transparent;font-size:16px;padding:30vh 20px;}
  .snd{font-size:10px !important;padding:9px 11px !important;letter-spacing:.08em !important;}
  @media (orientation:landscape){#prompt,.line{top:26%;} #cap{padding:18vh 20px;}}
  #stage{position:fixed;inset:0;z-index:6;pointer-events:none;}
  #prompt{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-weight:200;font-size:clamp(24px,7vw,38px);letter-spacing:.01em;color:rgba(220,230,255,0.9);text-align:center;padding:0 30px;transition:opacity 1s ease;}
  #prompt.fade{opacity:0;}
  .line{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);white-space:pre;font-weight:200;font-size:clamp(26px,7.5vw,46px);letter-spacing:.02em;color:#dbe7ff;text-align:center;max-width:92vw;text-shadow:0 0 26px rgba(var(--blue),0.3);opacity:0;animation:linein .4s ease forwards;}
  .line.lineout{animation:lineout .6s ease forwards;}
  .ltr{display:inline;}
  @keyframes linein{to{opacity:1;}}
  @keyframes lineout{to{opacity:0;transform:translate(-50%,-64%);}}

  #err{position:fixed;top:0;left:0;right:0;z-index:99;background:#3a0d0d;color:#ffd7d7;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;display:none;white-space:pre-wrap;}
  #dbg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:14;font:300 10px/1.4 ui-monospace,Menlo,monospace;color:rgba(var(--blue),0.7);background:rgba(0,0,0,0.4);padding:5px 9px;border:1px solid var(--line);border-radius:8px;user-select:none;}
  #gear{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:14;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,0.4);color:var(--dim);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #gear:active{background:rgba(var(--blue),0.12);}

  /* custom keyboard */
  #keyboard{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:26px 8px calc(10px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:34px;background:linear-gradient(to top,rgba(0,1,7,0.55),rgba(0,1,7,0));transition:opacity .7s ease;touch-action:none;}
  #keyboard.show{display:flex;}
  #keyboard.kbhide{opacity:0;pointer-events:none;}
  .krow{display:flex;gap:6px;justify-content:center;}
  .key{flex:1;max-width:42px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:rgba(233,238,255,0.8);font-size:clamp(25px,7.8vw,34px);font-weight:200;letter-spacing:.02em;text-shadow:0 0 16px rgba(var(--blue),0.28);padding:22px 0;touch-action:none;cursor:pointer;user-select:none;transition:transform .12s,color .12s,text-shadow .12s;}
  .key:active{color:#eaf1ff;text-shadow:0 0 30px rgba(var(--blue),0.95);transform:scale(1.22);}

  #hint{position:fixed;left:0;right:0;bottom:calc(50% + 40px);z-index:12;text-align:center;font-weight:300;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.3);opacity:0;transition:opacity .6s ease;pointer-events:none;}
  #hint.show{opacity:1;}
  #panel{position:fixed;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;z-index:16;max-width:520px;margin:0 auto;background:rgba(6,9,18,0.94);border:1px solid var(--line);border-radius:18px;padding:16px;display:none;flex-direction:column;gap:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  #panel.show{display:flex;}
  .prow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .tog{border:1px solid var(--line);background:var(--track);color:var(--dim);font:inherit;font-weight:300;letter-spacing:.1em;text-transform:uppercase;font-size:11px;padding:10px 14px;border-radius:100px;cursor:pointer;}
  .tog.on{color:#cfe0ff;border-color:rgba(var(--blue),0.55);background:rgba(var(--blue),0.10);}
  .prow2{display:flex;flex-direction:column;gap:11px;}
  .rw{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:12px;}
  .rw label{font-weight:300;letter-spacing:.1em;text-transform:uppercase;font-size:10px;color:var(--dim);}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;border-radius:2px;background:var(--line);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#dbe7ff;box-shadow:0 0 8px rgba(var(--blue),0.8);}
  #hideall{align-self:center;margin-top:2px;border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--dim);font:inherit;font-weight:300;letter-spacing:.14em;text-transform:uppercase;font-size:11px;padding:10px 18px;border-radius:100px;cursor:pointer;}
  #toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);z-index:26;background:rgba(10,14,26,0.92);border:1px solid var(--line);color:#cfe0ff;font-size:12px;padding:10px 16px;border-radius:100px;opacity:0;transition:opacity .4s ease;pointer-events:none;max-width:80vw;text-align:center;}
  #toast.show{opacity:1;}
  #toptap{position:fixed;top:0;left:0;right:0;height:14%;z-index:13;}
  #statusline{font:300 10px/1.4 ui-monospace,Menlo,monospace;color:rgba(var(--blue),0.6);text-align:center;letter-spacing:.04em;}
  .done2{color:#cfe0ff !important;border-color:rgba(var(--blue),0.6) !important;background:rgba(var(--blue),0.12) !important;}
  #result{position:fixed;inset:0;z-index:20;background:rgba(2,4,10,0.95);display:none;flex-direction:column;padding:calc(40px + env(safe-area-inset-top)) 28px calc(30px + env(safe-area-inset-bottom));gap:16px;}
  #result.show{display:flex;}
  #result h3{font-weight:200;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:rgba(var(--blue),0.8);}
  #rtext{flex:1;overflow:auto;font-weight:300;font-size:17px;line-height:1.7;color:#e9eeff;white-space:pre-wrap;}
  #rmeta{font:300 11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:rgba(var(--blue),0.7);}
  #rnote{font-size:12px;color:rgba(255,255,255,0.4);line-height:1.5;}
  .rbtns{display:flex;gap:10px;flex-wrap:wrap;}
  .rbtn{border:1px solid var(--line);background:rgba(255,255,255,0.03);color:#dbe7ff;font:inherit;font-weight:300;letter-spacing:.12em;text-transform:uppercase;font-size:11px;padding:12px 18px;border-radius:100px;cursor:pointer;}
  #gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px;text-align:center;background:radial-gradient(120% 90% at 50% 40%,rgba(5,6,15,0.95),rgba(0,1,7,0.98));transition:opacity .8s ease;}
  #gate.gone{opacity:0;pointer-events:none;}
  .mark{font-weight:200;letter-spacing:.42em;font-size:12px;text-transform:uppercase;color:var(--dim);padding-left:.42em;}
  .title{font-weight:200;font-size:clamp(28px,8vw,44px);line-height:1.1;max-width:14ch;}
  .title em{font-style:normal;color:#8fb4ff;}
  .g-sub{font-weight:300;font-size:14px;line-height:1.6;color:var(--dim);max-width:32ch;}
  #enter{border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--ink);font:inherit;font-weight:300;letter-spacing:.18em;text-transform:uppercase;font-size:12px;padding:16px 32px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:12px;}
  #enter .dot{width:6px;height:6px;border-radius:50%;background:#8fb4ff;box-shadow:0 0 10px #8fb4ff;}
</style>
</head>
<body>
<div id="err"></div>
<canvas id="sky"></canvas>
<textarea id="cap" autocapitalize="sentences" autocomplete="on" autocorrect="on" spellcheck="true"></textarea>
<div id="stage"><div id="prompt">What's on your mind?</div><div id="words"></div></div>
<div id="toptap"></div>
<div id="hint">Let the words drift</div>
<div id="keyboard"></div>

<div id="panel">
  <div class="prow">
    <button id="donebtn" class="tog done2">Done</button>
    <button id="recenter" class="tog">Recenter</button>
    <button id="fsbtn" class="tog">Fullscreen</button>
  </div>
  <div class="prow">
    <button id="compassBtn" class="tog on">Compass</button>
    <button id="gyroBtn" class="tog on">Gyro</button>
    <button id="swipeBtn" class="tog">Swipe</button>
  </div>
  <div class="prow">
    <button data-snd="off" class="tog snd on">Silent</button>
    <button data-snd="drone" class="tog snd">Drone</button>
    <button data-snd="space" class="tog snd">Space</button>
    <button data-snd="noise" class="tog snd">Noise</button>
    <button data-snd="perc" class="tog snd">Percussion</button>
  </div>
  <div class="prow2">
    <div class="rw"><label>Look</label><input id="look" type="range" min="10" max="1000" value="60"></div>
    <div class="rw"><label>Speed</label><input id="speed" type="range" min="-300" max="300" value="0"></div>
    <div class="rw"><label>Density</label><input id="density" type="range" min="0" max="100" value="12"></div>
    <div class="rw"><label>Glow</label><input id="glow" type="range" min="10" max="100" value="22"></div>
    <div class="rw"><label>Fade</label><input id="fade" type="range" min="15" max="100" value="43"></div>
    <div class="rw"><label>Pause</label><input id="pause" type="range" min="8" max="200" value="37"></div>
    <div class="rw"><label>Volume</label><input id="vol" type="range" min="0" max="100" value="50"></div>
  </div>
  <div id="statusline">compass: waiting…</div>
  <button id="hideall">Hide all · pure space</button>
</div>

<div id="toast"></div>

<div id="result">
  <h3>Your reflection</h3>
  <div id="rmeta"></div>
  <div id="rtext"></div>
  <div id="rnote"></div>
  <div class="rbtns"><button class="rbtn" id="save">Save .txt</button><button class="rbtn" id="again">Write again</button></div>
</div>

<div id="gate">
  <div class="mark">Ambient Reflection</div>
  <div class="title">A space to <em>empty your mind</em></div>
  <button id="enter"><span class="dot"></span>Begin</button>
</div>

    if(!text){hint.textContent='Nothing written yet';hint.classList.add('show');setTimeout(function(){hint.classList.remove('show');},2000);return;}
    kb.classList.remove('show');lastRaw=text;result.classList.add('show');
    lastMeta=fmtMeta();rmeta.textContent=lastMeta;
    var off=offlineClean(text);rtext.textContent=off;lastClean=off;   // instant offline result first
    rnote.textContent='Interpreting your words\u2026';
    var ai=await aiClean(text);
    if(ai){lastClean=ai;rtext.textContent=ai;rnote.textContent='Interpreted by AI \u2014 meaning rebuilt, your voice kept.';}
    else{rnote.textContent='Offline mode \u2014 spelling & spacing fixed on your phone. (Full AI needs signal + your Worker URL.)';}
  }
  document.getElementById('save').addEventListener('click',function(){var t=Date.now();var head=lastMeta?(lastMeta+'\n\n'):'';downloadText('reflection-'+t+'.txt',head+(lastClean||lastRaw));if(lastClean&&lastClean!==lastRaw)downloadText('reflection-raw-'+t+'.txt',head+lastRaw);});
  document.getElementById('again').addEventListener('click',function(){buffer='';started=false;startedAt=0;lastRaw='';lastClean='';letters=[];curLine=null;wordsInLine=0;atWordStart=true;while(words.firstChild)words.removeChild(words.firstChild);prompt.classList.remove('fade');result.classList.remove('show');cap.value='';prevVal='';cap.focus();});

  // ===== PANEL / CONTROLS =====
  var immersive=false;
  var panel=document.getElementById('panel'),toptap=document.getElementById('toptap'),panelOpen=false;
  function setPanel(on){panelOpen=on;panel.classList.toggle('show',on);}
  toptap.addEventListener('click',function(e){e.stopPropagation();if(!immersive)setPanel(!panelOpen);});
  document.getElementById('donebtn').addEventListener('click',function(e){e.stopPropagation();setPanel(false);finish();});
  var toast=document.getElementById('toast'),toastT;
  function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove('show');},3000);}
  var $look=document.getElementById('look'),$speed=document.getElementById('speed'),$density=document.getElementById('density'),$glow=document.getElementById('glow'),$fade=document.getElementById('fade'),$pause=document.getElementById('pause');
  var SKEY='ambient_settings_v1';
  function saveSettings(){try{localStorage.setItem(SKEY,JSON.stringify({look:$look.value,speed:$speed.value,density:$density.value,glow:$glow.value,fade:$fade.value,pause:$pause.value,compass:useCompass?1:0,gyro:useGyro?1:0,swipe:useSwipe?1:0,snd:curSnd,vol:($vol?$vol.value:50)}));}catch(e){}}
  function loadSettings(){try{var raw=localStorage.getItem(SKEY);if(!raw)return;var s=JSON.parse(raw);if(s.look!=null)$look.value=s.look;if(s.speed!=null)$speed.value=s.speed;if(s.density!=null)$density.value=s.density;if(s.glow!=null)$glow.value=s.glow;if(s.fade!=null)$fade.value=s.fade;if(s.pause!=null)$pause.value=s.pause;if(s.compass!=null){useCompass=!!s.compass;var cb=document.getElementById('compassBtn');if(cb)cb.classList.toggle('on',useCompass);}if(s.gyro!=null){useGyro=!!s.gyro;var gb=document.getElementById('gyroBtn');if(gb)gb.classList.toggle('on',useGyro);}if(s.swipe!=null){useSwipe=!!s.swipe;var sb=document.getElementById('swipeBtn');if(sb)sb.classList.toggle('on',useSwipe);}if(s.vol!=null){var vv=document.getElementById('vol');if(vv)vv.value=s.vol;aVol=+s.vol/100;}if(s.snd){curSnd=s.snd;var sbs=document.querySelectorAll('.snd');for(var q2=0;q2<sbs.length;q2++)sbs[q2].classList.toggle('on',sbs[q2].getAttribute('data-snd')===curSnd);}}catch(e){}}
  function applySliders(){cfg.gain=+$look.value/100;cfg.speed=(+$speed.value/100)*1.2;cfg.glow=+$glow.value/100;LETTER_DUR=(+$fade.value/100)*8000;PAUSE_MS=(+$pause.value)*10;var tc=Math.round(150+(+$density.value/100)*1300);if(tc!==cfg.count){cfg.count=tc;rebuild();}saveSettings();}
  var sl=[$look,$speed,$density,$glow,$fade,$pause];for(var q=0;q<sl.length;q++)sl[q].addEventListener('input',applySliders,{passive:true});
  function recenterNow(){yaw0=(useCompass?rawCompass:0)+(useGyro?rawTiltYaw:0);pitch0=rawPitch;}
  document.getElementById('recenter').addEventListener('click',function(e){e.stopPropagation();recenterNow();say('Recentered');});
  var compassBtn=document.getElementById('compassBtn'),gyroBtn=document.getElementById('gyroBtn');
  compassBtn.addEventListener('click',function(e){e.stopPropagation();useCompass=!useCompass;compassBtn.classList.toggle('on',useCompass);recenterNow();saveSettings();});
  gyroBtn.addEventListener('click',function(e){e.stopPropagation();useGyro=!useGyro;gyroBtn.classList.toggle('on',useGyro);recenterNow();saveSettings();});
  var swipeBtn=document.getElementById('swipeBtn');
  swipeBtn.addEventListener('click',function(e){e.stopPropagation();useSwipe=!useSwipe;swipeBtn.classList.toggle('on',useSwipe);saveSettings();});
  var fsbtn=document.getElementById('fsbtn');
  var isStandalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(isStandalone){fsbtn.style.display='none';}
  fsbtn.addEventListener('click',function(e){e.stopPropagation();var el=document.documentElement,d=document;var fsEl=d.fullscreenElement||d.webkitFullscreenElement;var req=el.requestFullscreen||el.webkitRequestFullscreen;var exit=d.exitFullscreen||d.webkitExitFullscreen;if(!req){say('iPhone: delete any old icon, then Share → Add to Home Screen from this page');return;}try{if(fsEl)exit.call(d);else req.call(el);}catch(_){say('Fullscreen not available here');}});
  var dbg=document.getElementById('statusline');
  setInterval(function(){dbg.textContent='compass '+(useCompass?(compassSeen?'live':'on'):'off')+' · gyro '+(useGyro?(gyroSeen?'live':'on'):'off');},200);
  function setImmersive(on){immersive=on;if(on){setPanel(false);try{cap.blur();}catch(e){}say('Double-tap to bring it back');}else{if(!result.classList.contains('show')){try{cap.focus();}catch(e){}}}}
  document.getElementById('hideall').addEventListener('click',function(e){e.stopPropagation();setImmersive(true);});
  var lastTap=0;
  addEventListener('touchend',function(){var t=Date.now();if(t-lastTap<320&&immersive)setImmersive(false);lastTap=t;});
  addEventListener('dblclick',function(){if(immersive)setImmersive(false);});
  addEventListener('pointerdown',function(){if(kbFaded&&kb.classList.contains('show')&&!panelOpen&&!result.classList.contains('show'))kbShow();},{passive:true});

  // ===== AMBIENT SOUND (procedural, offline) =====
  var AC=null,master=null,aNodes=[],percTimer=null,curSnd='off',aVol=0.5;
  function ensureAC(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=aVol;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}}
  function nbuf(type){var len=Math.floor(AC.sampleRate*2),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0),i;if(type==='brown'){var last=0;for(i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}}else if(type==='pink'){var b0=0,b1=0,b2=0;for(i=0;i<len;i++){var w2=Math.random()*2-1;b0=0.99765*b0+w2*0.0990460;b1=0.96300*b1+w2*0.2965164;b2=0.57000*b2+w2*1.0526913;d[i]=(b0+b1+b2+w2*0.1848)*0.12;}}else{for(i=0;i<len;i++)d[i]=Math.random()*2-1;}return b;}
  function stopSnd(){if(percTimer){clearInterval(percTimer);percTimer=null;}for(var i=0;i<aNodes.length;i++){try{aNodes[i].stop&&aNodes[i].stop();}catch(e){}try{aNodes[i].disconnect&&aNodes[i].disconnect();}catch(e){}}aNodes=[];}
  function droneMode(){[55,82.5,110,146.8].forEach(function(f,idx){var o=AC.createOscillator();o.type=idx%2?'triangle':'sine';o.frequency.value=f;var g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);o.start();g.gain.linearRampToValueAtTime(0.13/(idx+1),AC.currentTime+3);var lfo=AC.createOscillator();lfo.frequency.value=0.05+idx*0.02;var lg=AC.createGain();lg.gain.value=0.03;lfo.connect(lg);lg.connect(g.gain);lfo.start();aNodes.push(o,lfo);});}
  function spaceMode(){var s=AC.createBufferSource();s.buffer=nbuf('brown');s.loop=true;var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=1.2;var g=AC.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(0.4,AC.currentTime+3);s.connect(bp);bp.connect(g);g.connect(master);s.start();var lfo=AC.createOscillator();lfo.frequency.value=0.03;var lg=AC.createGain();lg.gain.value=350;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();var o=AC.createOscillator();o.type='sine';o.frequency.value=432;var og=AC.createGain();og.gain.value=0;og.gain.linearRampToValueAtTime(0.04,AC.currentTime+4);var tr=AC.createOscillator();tr.frequency.value=0.08;var tg=AC.createGain();tg.gain.value=0.02;tr.connect(tg);tg.connect(og.gain);o.connect(og);og.connect(master);o.start();tr.start();aNodes.push(s,lfo,o,tr);}
  function noiseMode(){var s=AC.createBufferSource();s.buffer=nbuf('pink');s.loop=true;var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;var g=AC.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(0.5,AC.currentTime+2);s.connect(lp);lp.connect(g);g.connect(master);s.start();aNodes.push(s);}
  function percMode(){var o=AC.createOscillator();o.type='sine';o.frequency.value=98;var og=AC.createGain();og.gain.value=0;og.gain.linearRampToValueAtTime(0.05,AC.currentTime+2);o.connect(og);og.connect(master);o.start();aNodes.push(o);function tick(){if(!AC)return;var t=AC.currentTime;var s=AC.createBufferSource();s.buffer=nbuf('white');var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=200;bp.Q.value=2;var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+0.008);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+0.35);}tick();percTimer=setInterval(tick,1400);}
  function setSound(mode){ensureAC();if(!AC)return;stopSnd();curSnd=mode;if(mode==='drone')droneMode();else if(mode==='space')spaceMode();else if(mode==='noise')noiseMode();else if(mode==='perc')percMode();}
  var sndBtns=document.querySelectorAll('.snd');
  for(var si=0;si<sndBtns.length;si++){(function(b){b.addEventListener('click',function(e){e.stopPropagation();for(var j=0;j<sndBtns.length;j++)sndBtns[j].classList.remove('on');b.classList.add('on');setSound(b.getAttribute('data-snd'));saveSettings();});})(sndBtns[si]);}
  var $vol=document.getElementById('vol');
  if($vol)$vol.addEventListener('input',function(){aVol=+$vol.value/100;if(master)master.gain.value=aVol;saveSettings();},{passive:true});

  // ===== BOOT =====
  resize();rebuild();loadSettings();applySliders();requestAnimationFrame(frame);
  var gate=document.getElementById('gate'),enter=document.getElementById('enter'),launched=false;
  function launch(){
    if(launched)return;launched=true;
    try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(function(res){if(res==='granted'){addEventListener('deviceorientation',onOrient,{passive:true});addEventListener('deviceorientationabsolute',onOrient,{passive:true});}}).catch(function(){});}}catch(_){}
    gate.classList.add('gone');cap.focus();if(curSnd&&curSnd!=='off')setSound(curSnd);
  }
  enter.onclick=launch;
  enter.addEventListener('touchend',function(e){e.preventDefault();launch();});
  gate.addEventListener('touchend',function(){launch();});


}catch(err){var bx=document.getElementById('err');bx.style.display='block';bx.textContent='ERROR (init): '+(err&&err.message||err);}
</script>
